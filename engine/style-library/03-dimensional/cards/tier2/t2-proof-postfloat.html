<!doctype html>
<!--
  DIMENSIONAL · tier2 · proof · POSTFLOAT
  Support card: three of the creator's own posts float in 3D around the speaker,
  each wearing a view-count pill. The social-proof beat — "this works, here is
  the receipt" — without cutting away from the person saying it.

  TIER 2 RULES THIS CARD OBEYS:
  · The root is transparent. Only the floating cards paint.
  · Nothing is placed in the centre column. The three cards sit in the top band
    and the two outer columns, so a centred speaker is never covered. The guard
    region is marked below; if you move a card, keep out of it.

  Deterministic: the drift is GSAP yoyo on fixed durations, not random walk.
  Every offset below is a literal.

  Slots: post1/views1, post2/views2, post3/views3 (post ~34 chars, views ~10).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: transparent; }

      /* TIER 2 — transparent root. It overlays the video. */
      #t2-proof-postfloat {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: transparent; color: var(--text);
        font-family: var(--font-body); overflow: hidden;
        perspective: var(--persp);
        perspective-origin: 50% 46%;
      }

      /* Face guard: x 660–1260, y 300–1080. No card may intrude here. Kept as a
         real (invisible) element so the constraint is visible in the DOM and in
         the Studio inspector rather than living only in a comment. */
      #t2-proof-postfloat .face-guard {
        position: absolute; left: 660px; top: 300px; width: 600px; height: 780px;
        pointer-events: none; opacity: 0;
      }

      #t2-proof-postfloat .post {
        position: absolute;
        width: 290px; height: 400px;
        transform-style: preserve-3d;
      }
      #t2-proof-postfloat .post .card {
        position: absolute; inset: 0;
        border-radius: var(--card-radius);
        background:
          linear-gradient(165deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04) 55%),
          rgba(10, 12, 16, 0.92);
        border: 1px solid var(--surface-edge);
        box-shadow:
          0 0 0 1px rgba(255,255,255,0.05),
          0 34px 70px rgba(0,0,0,0.72);
        overflow: hidden;
        backdrop-filter: blur(3px);
      }
      /* Stand-in post imagery: a warm frame band over a dark body. Real posters
         can be swapped in later by replacing .thumb's background. */
      #t2-proof-postfloat .post .thumb {
        position: absolute; left: 0; right: 0; top: 0; height: 232px;
        background: linear-gradient(145deg, #b5523c, #d4854a 42%, #6f86a4 74%, #2d4664);
      }
      #t2-proof-postfloat .post .thumb::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(180deg, transparent 52%, rgba(10,12,16,0.92));
      }
      #t2-proof-postfloat .post .cap {
        position: absolute; left: 18px; right: 18px; top: 252px;
        font-size: 19px; line-height: 1.35; font-weight: 500;
        color: var(--text);
        display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
        overflow: hidden;
      }
      /* The view pill — the actual proof. Sits proud of the card's bottom edge. */
      #t2-proof-postfloat .post .views {
        position: absolute; left: 50%; bottom: -17px; transform: translateX(-50%);
        display: inline-flex; align-items: center; gap: 8px;
        padding: 9px 17px; border-radius: 999px;
        background: #FFFFFF; color: #0A0C10;
        font-family: var(--font-mono); font-size: 17px; font-weight: 700;
        white-space: nowrap;
        box-shadow: 0 10px 26px rgba(0,0,0,0.55);
      }
      #t2-proof-postfloat .post .views .play {
        width: 0; height: 0;
        border-left: 9px solid #0A0C10;
        border-top: 6px solid transparent;
        border-bottom: 6px solid transparent;
      }
      #t2-proof-postfloat .post .fringe {
        position: absolute; inset: -1px; border-radius: calc(var(--card-radius) + 1px);
        pointer-events: none; mix-blend-mode: screen;
        box-shadow:
          calc(var(--fringe-offset) * -1) 0 0 rgba(var(--fringe-warm-rgb), 0.26),
          var(--fringe-offset) 0 0 rgba(var(--fringe-cool-rgb), 0.26);
      }

      /* Placement. Top band and the two outer columns only. */
      #t2-proof-postfloat .post.p1 { left: 178px;  top: 150px; transform: rotateY( 19deg) rotateZ(-6deg) translateZ(-110px); }
      #t2-proof-postfloat .post.p2 { left: 806px;  top: 44px;  transform: rotateY(  3deg) rotateZ( 2deg) translateZ(  40px); }
      #t2-proof-postfloat .post.p3 { left: 1448px; top: 178px; transform: rotateY(-21deg) rotateZ( 7deg) translateZ(-150px); }
    </style>
  </head>
  <body>
    <div id="t2-proof-postfloat" data-composition-id="t2-proof-postfloat" data-start="0" data-width="1920" data-height="1080">
      <div class="face-guard"></div>

      <div class="post p1">
        <div class="card">
          <div class="thumb"></div>
          <div class="cap" data-slot="post1">How to tell if an agent is actually working</div>
        </div>
        <div class="fringe"></div>
        <div class="views"><span class="play"></span><span data-slot="views1">23.5K views</span></div>
      </div>

      <div class="post p2">
        <div class="card">
          <div class="thumb"></div>
          <div class="cap" data-slot="post2">Stop wasting money on cloud agents</div>
        </div>
        <div class="fringe"></div>
        <div class="views"><span class="play"></span><span data-slot="views2">21.6K views</span></div>
      </div>

      <div class="post p3">
        <div class="card">
          <div class="thumb"></div>
          <div class="cap" data-slot="post3">The edit that doubled my watch time</div>
        </div>
        <div class="fringe"></div>
        <div class="views"><span class="play"></span><span data-slot="views3">18.2K views</span></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const ID = "#t2-proof-postfloat";

      /* Cards arrive from behind the speaker and settle into place. Staggered
         so the eye gets one, then the next, rather than a wall of three. */
      const POSTS = [
        { sel: ".p1", at: 0.00, fromX: 150, fromY:  70 },
        { sel: ".p2", at: 0.22, fromX:   0, fromY: 110 },
        { sel: ".p3", at: 0.44, fromX: -150, fromY:  70 },
      ];
      POSTS.forEach((p) => {
        tl.from(`${ID} ${p.sel}`, {
          autoAlpha: 0, z: -620, x: p.fromX, y: p.fromY,
          duration: 1.25, ease: "expo.out",
        }, p.at);
      });

      /* Pills pop after their card has landed. */
      tl.from(`${ID} .p1 .views`, { autoAlpha: 0, scale: 0.6, duration: 0.5, ease: "back.out(2.2)" }, 0.85)
        .from(`${ID} .p2 .views`, { autoAlpha: 0, scale: 0.6, duration: 0.5, ease: "back.out(2.2)" }, 1.07)
        .from(`${ID} .p3 .views`, { autoAlpha: 0, scale: 0.6, duration: 0.5, ease: "back.out(2.2)" }, 1.29);

      /* Idle drift. Different periods so they never bob in unison, which is
         what makes a float read as weightless rather than mechanical. */
      tl.to(`${ID} .p1`, { y: "-=22", duration: 3.1, ease: "sine.inOut", yoyo: true, repeat: 9 }, 1.3)
        .to(`${ID} .p2`, { y: "-=30", duration: 3.7, ease: "sine.inOut", yoyo: true, repeat: 7 }, 1.5)
        .to(`${ID} .p3`, { y: "-=18", duration: 2.8, ease: "sine.inOut", yoyo: true, repeat: 10 }, 1.4);

      window.__timelines["t2-proof-postfloat"] = tl;
    </script>
  </body>
</html>
