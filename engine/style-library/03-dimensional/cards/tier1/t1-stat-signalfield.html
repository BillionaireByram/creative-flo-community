<!doctype html>
<!--
  DIMENSIONAL · tier1 · stat · SIGNALFIELD
  Full-screen stat takeover built as an instrument readout: a tangled light
  trace sits inside two concentric tick-marked rings, crosshairs quarter the
  frame, and the number sits off to the side like a measurement taken FROM the
  object rather than a caption placed ON it.

  IMPORTANT — the trace is NOT audio-reactive. It is one fixed SVG path, drawn
  on with stroke-dashoffset. It is built to LOOK like an instrument reading a
  live signal, which is a very different claim. Do not wire it to audio and do
  not describe it to a client as responding to their track; if we ever want
  that, it needs real analysis data and a different card.

  Everything here is deterministic: the path is a literal, and the tick marks
  come from a repeating conic-gradient rather than a loop with random values.

  Slots: label (~18 chars), stat (~7 chars), caption (~46 chars).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../tokens.css" />
    <style>
      html, body { margin: 0; background: var(--canvas-deep); }

      #t1-stat-signalfield {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        background: var(--canvas); color: var(--text);
        font-family: var(--font-display); overflow: hidden;
      }

      /* The instrument sits left of centre so the stat has room to breathe. */
      #t1-stat-signalfield .instrument {
        position: absolute; left: 500px; top: 540px;
        width: 0; height: 0; z-index: 3;
      }

      /* Rings. Tick marks are a repeating conic-gradient masked to an annulus,
         which gives perfectly even spacing with no per-tick DOM. */
      #t1-stat-signalfield .ring {
        position: absolute; left: 50%; top: 50%;
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }
      #t1-stat-signalfield .ring.outer { width: 760px; height: 760px; }
      #t1-stat-signalfield .ring.inner { width: 520px; height: 520px; }

      #t1-stat-signalfield .ring .hoop {
        position: absolute; inset: 0; border-radius: 50%;
        border: 1.5px solid rgba(255, 255, 255, 0.34);
      }
      /* The warm/cool pair, offset in opposite directions. Always both. */
      #t1-stat-signalfield .ring .hoop.warm {
        border-color: rgba(var(--fringe-warm-rgb), 0.55);
        transform: translateX(calc(var(--fringe-offset) * -1));
        mix-blend-mode: screen;
      }
      #t1-stat-signalfield .ring .hoop.cool {
        border-color: rgba(var(--fringe-cool-rgb), 0.55);
        transform: translateX(var(--fringe-offset));
        mix-blend-mode: screen;
      }

      #t1-stat-signalfield .ticks {
        position: absolute; inset: -17px; border-radius: 50%;
        background: repeating-conic-gradient(
          from 0deg,
          rgba(255,255,255,0.55) 0deg 0.5deg,
          transparent 0.5deg 5deg
        );
        -webkit-mask: radial-gradient(circle, transparent 0 calc(50% - 17px), #000 calc(50% - 17px) 50%, transparent 50%);
        mask: radial-gradient(circle, transparent 0 calc(50% - 17px), #000 calc(50% - 17px) 50%, transparent 50%);
      }

      /* Crosshairs — quarter the frame, thin and faint. */
      #t1-stat-signalfield .cross {
        position: absolute; left: 50%; top: 50%;
        width: 1020px; height: 1020px; margin: -510px 0 0 -510px;
      }
      #t1-stat-signalfield .cross i {
        position: absolute; left: 50%; top: 50%;
        width: 1020px; height: 1px; margin: 0 0 0 -510px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.30) 18%, rgba(255,255,255,0.30) 82%, transparent);
        transform-origin: 50% 50%;
      }
      #t1-stat-signalfield .cross i:nth-child(1) { transform: rotate(38deg); }
      #t1-stat-signalfield .cross i:nth-child(2) { transform: rotate(-38deg); }

      /* The trace. Glow is a blurred duplicate under the crisp stroke. */
      #t1-stat-signalfield .trace {
        position: absolute; left: 50%; top: 50%;
        width: 620px; height: 620px; margin: -310px 0 0 -310px;
        overflow: visible;
      }
      #t1-stat-signalfield .trace path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      #t1-stat-signalfield .trace .glow  { stroke: #FFFFFF; stroke-width: 7; opacity: 0.5; filter: blur(13px); }
      #t1-stat-signalfield .trace .line  { stroke: #FFFFFF; stroke-width: 2.1; }
      #t1-stat-signalfield .trace .warm  { stroke: var(--fringe-warm); stroke-width: 1.6; opacity: 0.5; transform: translateX(calc(var(--fringe-offset) * -1)); mix-blend-mode: screen; }
      #t1-stat-signalfield .trace .cool  { stroke: var(--fringe-cool); stroke-width: 1.6; opacity: 0.5; transform: translateX(var(--fringe-offset)); mix-blend-mode: screen; }

      /* Rotated instrument label, hugging the lower-left of the outer ring. */
      #t1-stat-signalfield .label {
        position: absolute; left: -312px; top: 212px;
        font-family: var(--font-mono); font-size: 19px; font-weight: 700;
        letter-spacing: var(--tracking-micro); text-transform: uppercase;
        color: var(--text);
        transform: rotate(-52deg); transform-origin: 0 50%;
        white-space: nowrap;
      }
      #t1-stat-signalfield .label::before {
        content: ""; position: absolute; left: 0; bottom: -7px; width: 100%; height: 1px;
        background: linear-gradient(90deg, rgba(var(--fringe-warm-rgb),0.9), rgba(var(--fringe-cool-rgb),0.9));
      }

      /* --- the readout ------------------------------------------------------ */
      #t1-stat-signalfield .readout {
        position: absolute; right: 150px; top: 50%; transform: translateY(-50%);
        z-index: 5; text-align: right; max-width: 640px;
      }
      #t1-stat-signalfield .stat {
        font-family: var(--font-display); font-weight: 900;
        font-size: 268px; line-height: 0.82;
        letter-spacing: var(--tracking-display);
        background: var(--chrome-ramp);
        -webkit-background-clip: text; background-clip: text;
        color: transparent; -webkit-text-fill-color: transparent;
        text-shadow: 0 22px 54px rgba(0,0,0,0.8);
      }
      #t1-stat-signalfield .caption {
        margin-top: 26px;
        font-family: var(--font-body); font-weight: 500;
        font-size: 31px; line-height: 1.34; color: var(--text-dim);
      }
      #t1-stat-signalfield .rule {
        margin: 30px 0 0 auto; width: 150px; height: 2px;
        background: linear-gradient(90deg, rgba(var(--fringe-warm-rgb),0.9), rgba(var(--fringe-cool-rgb),0.9));
      }

      #t1-stat-signalfield .vignette {
        position: absolute; inset: 0; z-index: 7; pointer-events: none;
        background: var(--vignette);
      }
    </style>
  </head>
  <body>
    <div id="t1-stat-signalfield" data-composition-id="t1-stat-signalfield" data-start="0" data-width="1920" data-height="1080">
      <div class="instrument">
        <div class="cross"><i></i><i></i></div>

        <div class="ring outer">
          <div class="ticks"></div>
          <div class="hoop warm"></div>
          <div class="hoop cool"></div>
          <div class="hoop"></div>
        </div>
        <div class="ring inner">
          <div class="hoop warm"></div>
          <div class="hoop cool"></div>
          <div class="hoop"></div>
        </div>

        <!-- One fixed path. Deterministic by construction: it is a literal. -->
        <svg class="trace" viewBox="0 0 620 620" aria-hidden="true">
          <path class="glow" d="M196 470 C 150 392, 214 352, 262 318 C 300 290, 236 262, 268 224 C 300 186, 356 232, 338 272 C 318 316, 252 300, 276 352 C 300 404, 390 374, 372 316 C 352 252, 268 236, 294 176 C 316 126, 392 148, 404 196 C 418 252, 346 288, 370 340 C 394 392, 300 430, 268 400 C 232 366, 318 338, 344 374 C 372 412, 318 462, 262 452 C 214 444, 226 408, 258 396" />
          <path class="warm" d="M196 470 C 150 392, 214 352, 262 318 C 300 290, 236 262, 268 224 C 300 186, 356 232, 338 272 C 318 316, 252 300, 276 352 C 300 404, 390 374, 372 316 C 352 252, 268 236, 294 176 C 316 126, 392 148, 404 196 C 418 252, 346 288, 370 340 C 394 392, 300 430, 268 400 C 232 366, 318 338, 344 374 C 372 412, 318 462, 262 452 C 214 444, 226 408, 258 396" />
          <path class="cool" d="M196 470 C 150 392, 214 352, 262 318 C 300 290, 236 262, 268 224 C 300 186, 356 232, 338 272 C 318 316, 252 300, 276 352 C 300 404, 390 374, 372 316 C 352 252, 268 236, 294 176 C 316 126, 392 148, 404 196 C 418 252, 346 288, 370 340 C 394 392, 300 430, 268 400 C 232 366, 318 338, 344 374 C 372 412, 318 462, 262 452 C 214 444, 226 408, 258 396" />
          <path class="line" d="M196 470 C 150 392, 214 352, 262 318 C 300 290, 236 262, 268 224 C 300 186, 356 232, 338 272 C 318 316, 252 300, 276 352 C 300 404, 390 374, 372 316 C 352 252, 268 236, 294 176 C 316 126, 392 148, 404 196 C 418 252, 346 288, 370 340 C 394 392, 300 430, 268 400 C 232 366, 318 338, 344 374 C 372 412, 318 462, 262 452 C 214 444, 226 408, 258 396" />
        </svg>

        <div class="label" data-slot="label">Stereo Field</div>
      </div>

      <div class="readout">
        <div class="stat" data-slot="stat">94%</div>
        <div class="caption" data-slot="caption">of viewers never make it past the hook</div>
        <div class="rule"></div>
      </div>

      <div class="vignette"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const ID = "#t1-stat-signalfield";

      /* Draw the trace on. Each copy gets its own dash length from its own
         geometry, so the warm/cool ghosts stay locked to the crisp stroke. */
      document.querySelectorAll(`${ID} .trace path`).forEach((p) => {
        const len = p.getTotalLength();
        gsap.set(p, { strokeDasharray: len, strokeDashoffset: len });
        tl.to(p, { strokeDashoffset: 0, duration: 2.6, ease: "power2.inOut" }, 0.35);
      });

      /* Rings arrive first, outer then inner, and keep turning opposite ways. */
      tl.from(`${ID} .ring.outer`, { autoAlpha: 0, scale: 0.78, duration: 1.3, ease: "expo.out" }, 0)
        .from(`${ID} .ring.inner`, { autoAlpha: 0, scale: 0.72, duration: 1.3, ease: "expo.out" }, 0.18)
        .from(`${ID} .cross`,      { autoAlpha: 0, scale: 0.9,  duration: 1.4, ease: "power2.out" }, 0.3);

      tl.to(`${ID} .ring.outer .ticks`, { rotate:  40, duration: 20, ease: "none" }, 0);
      tl.to(`${ID} .ring.inner`,        { rotate: -26, duration: 20, ease: "none" }, 0);
      tl.to(`${ID} .cross`,             { rotate:  12, duration: 20, ease: "none" }, 0);

      tl.from(`${ID} .label`, { autoAlpha: 0, x: -26, duration: 0.9, ease: "power3.out" }, 1.5);

      /* The number lands last and hard — it is the point of the card. */
      tl.from(`${ID} .stat`,    { autoAlpha: 0, y: 46, filter: "blur(22px)", duration: 1.1, ease: "expo.out" }, 1.15)
        .from(`${ID} .caption`, { autoAlpha: 0, y: 22, duration: 0.9, ease: "power3.out" }, 1.5)
        .from(`${ID} .rule`,    { scaleX: 0, transformOrigin: "100% 50%", duration: 0.8, ease: "power3.out" }, 1.7);

      window.__timelines["t1-stat-signalfield"] = tl;
    </script>
  </body>
</html>
